[package]
name = "mp-dpf"
version = "0.1.0"
edition = "2024"

[dependencies]
bitvec = "1.0.1"
criterion = "0.7.0"
itertools = "0.14.0"
nalgebra = { version = "0.34.0", features = ["rand"] }
